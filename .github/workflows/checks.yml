name: 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_pattern:
        description: '可选：传给 unittest -k 的测试筛选关键字'
        required: false
        type: string
        default: ''
      verbose:
        description: '是否输出详细测试用例日志 (-v)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 控制器与构建脚本单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 运行单元测试
        env:
          TEST_PATTERN: ${{ github.event_name == 'workflow_dispatch' && inputs.test_pattern || '' }}
          VERBOSE: ${{ github.event_name != 'workflow_dispatch' || inputs.verbose }}
        run: |
          flags=()
          [ "$VERBOSE" = "true" ] && flags+=(-v)
          if [ -n "$TEST_PATTERN" ]; then
            PYTHONPATH=src python3 -B -m unittest discover -s tests -k "$TEST_PATTERN" "${flags[@]}"
          else
            PYTHONPATH=src python3 -B -m unittest discover -s tests "${flags[@]}"
          fi
